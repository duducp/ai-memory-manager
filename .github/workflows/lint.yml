name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck install.sh src/*.sh src/platform/*.sh

      - name: bash syntax
        run: |
          for f in install.sh src/*.sh src/platform/*.sh; do
            bash -n "$f"
          done
